name: ci

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Test
        run: make test
      - name: Test with sanitizers
        run: make clean && make CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=address,undefined" test
